services:
  - type: web
    name: meta-leads-sheets-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_VERSION
        value: v22.0
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false

      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: woi_seminar_registration_followup
      - key: WHATSAPP_LANGUAGE_CODE
        value: en
      - key: WHATSAPP_TEMPLATE_BODY_FIELDS
        value: customer_name,seminar_date,seminar_time,arrival_time,venue
      - key: SEMINAR_TIMEZONE
        value: Asia/Kolkata
      - key: SEMINAR_VENUE
        value: Kuvempunagara, Mysuru - https://g.co/kgs/FDbcqh
      - key: SEMINAR_THURSDAY_TIME
        value: 6:00 PM to 8:00 PM
      - key: SEMINAR_THURSDAY_ARRIVAL
        value: 5:45 PM
      - key: SEMINAR_SUNDAY_TIME
        value: 10:30 AM to 12:30 PM
      - key: SEMINAR_SUNDAY_ARRIVAL
        value: 10:15 AM
