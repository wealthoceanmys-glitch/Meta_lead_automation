services:
  - type: web
    name: woi-lead-crm-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_ENABLED
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: woi_seminar_registration_followup
      - key: WHATSAPP_LANGUAGE_CODE
        value: en
      - key: SEMINAR_VENUE
        value: Kuvempunagara, Mysuru - https://g.co/kgs/FDbcqh
      - key: FRONTEND_ORIGIN
        sync: false
